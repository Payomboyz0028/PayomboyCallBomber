name: PayomboyZ 24/7 Render Keep-Alive Watchdog

on:
  schedule:
    # Run every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  uptime-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Render 24/7 Keep-Alive Watchdog
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || 'rnd_jyF7yXrSoMYfKIP4YkqOwvMACItJ' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_PING_URLS: ${{ secrets.TARGET_PING_URLS }}
        run: |
          python watchdog_ping.py
